[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xc2bot"
version = "0.1.0"
description = "A Windows-first, diagnostics-led XC2 farming automation foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mss>=10.0.0"]

[project.scripts]
xc2bot = "xc2bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
